[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E501",  # line too long - handled by formatter
]

[tool.ruff.lint.per-file-ignores]
# GTK/GI requires gi.require_version() before gi.repository imports — E402 is structural
"usr/share/gitrepo/build_package/gui/**/*.py" = ["E402"]
"usr/share/gitrepo/build_iso/gui/**/*.py" = ["E402"]
"usr/share/nautilus-python/extensions/*.py" = ["E402"]

[tool.mypy]
strict = true
explicit_package_bases = true
mypy_path = "usr/share"
exclude = [
    "^tests/",
    # Legacy dynamic CLI/Git owners remain test-covered; type them only in coherent owner slices.
    "^usr/share/gitrepo/build_package/",
    "^usr/share/gitrepo/build_iso/gui/",
    "^usr/share/gitrepo/build_iso/core/(history_store|iso_builder|profile_catalog)\\.py$",
    "^usr/share/gitrepo/build_iso/(build_iso|cli|config|git_utils|github_api|local_builder|main|menu_system)\\.py$",
    "^usr/share/nautilus-python/",
]

[tool.pyright]
include = [
    "usr/share/gitrepo/common",
    "usr/share/gitrepo/build_iso/core/config.py",
    "usr/share/gitrepo/build_iso/core/container_manager.py",
    "usr/share/gitrepo/build_iso/core/settings.py",
    "usr/share/gitrepo/build_iso/local_config.py",
]
extraPaths = ["usr/share"]
reportMissingModuleSource = false

[tool.pytest.ini_options]
filterwarnings = [
    # PyGObject 3.54 still reads this deprecated GLib alias while importing its own override.
    "ignore:GLib\\.unix_signal_add_full is deprecated; use GLibUnix\\.signal_add_full instead:gi.PyGIDeprecationWarning",
]
